name: tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and optional geospatial and MCP dependencies
        run: python -m pip install -e ".[full]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Import MCP server
        run: python -c "import mcp; import agrodigital.mcp_server"
      - name: CLI smoke tests
        run: |
          agrodigital capabilities
          agrodigital check-geojson examples/sample_lot.geojson
          agrodigital gdd --tmin 12 --tmax 28 --base 10
          agrodigital rainfall 12.5 0 8 3.2
          agrodigital raster-info --help
          agrodigital stac-search --help
          agrodigital download-asset --help
          agrodigital sentinel2-ndvi --help
          agrodigital sentinel2-stac-ndvi --help
