[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrodigital-ai"
version = "0.2.0"
description = "Open modular AgTech, GIS and remote-sensing toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dante Sosa"}]
keywords = ["agriculture", "agtech", "gis", "remote-sensing", "forestry", "agrometeorology", "stac", "raster"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.optional-dependencies]
geo = ["shapely>=2.0", "pyproj>=3.6"]
raster = ["numpy>=1.24", "rasterio>=1.3"]
stac = []
full = ["numpy>=1.24", "shapely>=2.0", "pyproj>=3.6", "rasterio>=1.3"]

[project.scripts]
agrodigital = "agrodigital.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
