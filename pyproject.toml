[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrodigital-ai"
version = "0.4.0"
description = "Open modular AgTech, GIS, remote-sensing and AI-agent toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dante Sosa"}]
keywords = ["agriculture", "agtech", "gis", "remote-sensing", "forestry", "agrometeorology", "stac", "raster", "sentinel-2", "mcp", "ai-agents"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.optional-dependencies]
geo = ["shapely>=2.0", "pyproj>=3.6"]
raster = ["numpy>=1.24", "rasterio>=1.3"]
stac = []
ai = ["mcp>=1.0,<2"]
full = ["numpy>=1.24", "shapely>=2.0", "pyproj>=3.6", "rasterio>=1.3", "mcp>=1.0,<2"]

[project.scripts]
agrodigital = "agrodigital.cli:main"
agrodigital-mcp = "agrodigital.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
